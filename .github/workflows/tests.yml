name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: System libraries OpenCV needs on a headless runner
        run: sudo apt-get update -q && sudo apt-get install -y -q libgl1 libglib2.0-0
      - run: uv sync --locked
      - run: uv run pytest -q
